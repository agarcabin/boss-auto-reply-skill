<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSS 回复沟通报告</title>
<style>
  :root {
    --ink: #15212d;
    --muted: #6f8192;
    --line: #dce5eb;
    --paper: #ffffff;
    --bg: #eef3f6;
    --navy: #11202c;
    --teal: #0d7f8c;
    --teal-soft: #e4f4f4;
    --blue: #2b6fa8;
    --blue-soft: #e8f1f8;
    --amber: #9a6411;
    --amber-soft: #fbf1df;
    --rose: #a83b4d;
    --rose-soft: #fbe9ec;
    --shadow: 0 18px 45px rgba(25, 46, 62, .10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 8% -10%, rgba(13,127,140,.16), transparent 32rem),
      radial-gradient(circle at 100% 0%, rgba(43,111,168,.10), transparent 34rem),
      var(--bg);
    color: var(--ink);
    font-family: "Microsoft YaHei UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 14px;
  }
  button, input, select { font: inherit; }
  .shell { max-width: 1480px; margin: 0 auto; padding: 30px 28px 56px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 6px 2px 24px; }
  .eyebrow { color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
  h1 { margin: 7px 0 6px; font-size: clamp(26px, 3vw, 40px); line-height: 1.1; letter-spacing: -.02em; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }
  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .live { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-size: 12px; font-weight: 700; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px rgba(13,127,140,.12); }
  .live.stale { background: var(--rose-soft); color: var(--rose); }
  .live.stale i { background: var(--rose); box-shadow: 0 0 0 4px rgba(168,59,77,.12); }
  .updated { color: var(--muted); font-size: 12px; min-width: 96px; text-align: right; }
  .btn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 9px; padding: 8px 13px; cursor: pointer; font-weight: 600; transition: .16s ease; }
  .btn:hover { border-color: #b8c8d3; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(25,46,62,.08); }
  .metrics { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .metric { position: relative; overflow: hidden; background: var(--paper); border: 1px solid rgba(220,229,235,.9); border-radius: 15px; padding: 17px 18px 15px; box-shadow: 0 8px 24px rgba(25,46,62,.05); }
  .metric::after { content: ""; position: absolute; inset: auto -18px -28px auto; width: 74px; height: 74px; border-radius: 50%; background: var(--teal-soft); opacity: .72; }
  .metric:nth-child(4)::after { background: var(--blue-soft); }
  .metric:nth-child(5)::after { background: var(--amber-soft); }
  .metric:nth-child(6)::after { background: var(--rose-soft); }
  .metric:nth-child(7)::after { background: var(--rose-soft); }
  .metric:nth-child(7) .value { color: var(--rose); }
  .metric .label { position: relative; z-index: 1; color: var(--muted); font-size: 12px; font-weight: 600; }
  .metric .value { position: relative; z-index: 1; margin-top: 7px; font-size: 29px; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
  .metric .hint { position: relative; z-index: 1; margin-top: 7px; color: #8b9aa7; font-size: 11px; }
  .filter-card { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; background: rgba(255,255,255,.82); border: 1px solid rgba(220,229,235,.9); border-radius: 13px; padding: 12px; margin-bottom: 12px; backdrop-filter: blur(8px); }
  .search { flex: 1 1 250px; min-width: 200px; position: relative; }
  .search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 9px; outline: none; background: #fff; }
  .search input:focus { border-color: #89b8bf; box-shadow: 0 0 0 3px rgba(13,127,140,.10); }
  .search::before { content: "⌕"; position: absolute; left: 12px; top: 7px; color: #93a3ae; font-size: 18px; }
  select { padding: 9px 30px 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); outline: none; }
  select:focus { border-color: #89b8bf; }
  .filter-meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .table-card { background: var(--paper); border: 1px solid rgba(220,229,235,.95); border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); }
  .table-scroll { overflow: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1240px; }
  thead th { position: sticky; top: 0; z-index: 2; background: #f6f9fb; color: #5c7080; text-align: left; font-size: 11px; letter-spacing: .04em; font-weight: 800; padding: 13px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--teal); }
  thead th .arrow { color: var(--teal); margin-left: 4px; font-size: 10px; }
  tbody td { padding: 13px 14px; border-bottom: 1px solid #edf2f5; vertical-align: top; }
  tbody tr { cursor: pointer; transition: background .12s ease; }
  tbody tr:hover { background: #f8fcfc; }
  tbody tr:last-child td { border-bottom: 0; }
  .time { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
  .time small { display: block; margin-top: 3px; color: #93a3ae; font-weight: 500; }
  .person { font-weight: 700; }
  .job { color: #5d7181; max-width: 260px; }
  .enterprise-cell { color: #0d6b73; font-weight: 800; white-space: nowrap; }
  .tag { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 7px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .tag.passive { color: var(--blue); background: var(--blue-soft); }
  .tag.active { color: var(--amber); background: var(--amber-soft); }
  .tag.unknown { color: #758493; background: #eef2f5; }
  .contacts { display: grid; gap: 4px; min-width: 155px; }
  .contact { display: flex; gap: 7px; align-items: baseline; white-space: nowrap; }
  .contact b { width: 34px; color: #8796a2; font-size: 10px; font-weight: 700; }
  .contact .yes { color: var(--ink); font-weight: 700; }
  .contact .no { color: #adb9c3; }
  .contact .resume { color: var(--teal); }
  .count { font-variant-numeric: tabular-nums; font-weight: 800; }
  .count span { color: #93a3ae; font-size: 11px; font-weight: 500; }
  .row-chat-btn { border: 1px solid #bfe0e1; background: #effafa; color: #0d6b73; border-radius: 7px; padding: 5px 8px; cursor: pointer; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .row-chat-btn:hover { background: #dff3f3; border-color: #89c8cb; }
  .handoff-badge { display: inline-block; margin-left: 7px; padding: 2px 6px; border-radius: 5px; background: #fbe9ec; color: #a83b4d; font-size: 10px; font-weight: 800; vertical-align: 1px; }
  tbody tr.needs-human { background: #fff7f8; }
  tbody tr.needs-human:hover { background: #fff1f3; }
  tbody tr.needs-human td:first-child { box-shadow: inset 3px 0 #d95c6e; }
  .person.needs-human-name { color: #a83b4d; }
  .empty { display: none; padding: 66px 20px; text-align: center; color: var(--muted); }
  .empty b { display: block; margin-bottom: 6px; color: var(--ink); font-size: 16px; }
  .drawer-mask { position: fixed; inset: 0; background: rgba(10,22,31,.32); opacity: 0; pointer-events: none; transition: .18s ease; z-index: 8; }
  .drawer { position: fixed; top: 3vh; bottom: 3vh; right: 20px; width: min(560px, 94vw); height: auto; background: #fff; border: 1px solid rgba(220,229,235,.9); border-radius: 18px; box-shadow: 0 24px 70px rgba(10,22,31,.22); transform: translateX(calc(100% + 40px)); transition: .24s cubic-bezier(.2,.8,.2,1); z-index: 9; display: flex; flex-direction: column; overflow: hidden; }
  body.drawer-open .drawer-mask { opacity: 1; pointer-events: auto; }
  body.drawer-open .drawer { transform: translateX(0); }
  .drawer-head { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
  .drawer-head .eyebrow { display: none; }
  .drawer-head h2 { margin: 0; padding-right: 30px; font-size: 19px; line-height: 1.25; }
  .drawer-head p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
  .drawer-tools { display: flex; gap: 6px; margin-top: 8px; }
  .drawer-tools input { flex: 1; min-width: 0; padding: 5px 8px; font-size: 12px; border: 1px solid var(--line); border-radius: 7px; background: #fff; outline: none; }
  .drawer-tools input:focus { border-color: #89b8bf; box-shadow: 0 0 0 3px rgba(13,127,140,.08); }
  .drawer-tools select { flex: 1.35; min-width: 0; padding: 5px 22px 5px 8px; font-size: 12px; }
  .drawer-close { position: absolute; top: 10px; right: 12px; width: 26px; height: 26px; border: 0; border-radius: 7px; background: #f0f5f7; cursor: pointer; font-size: 15px; color: #607383; }
  .drawer-facts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .fact { padding: 3px 7px; border-radius: 6px; background: #f4f8fa; color: #526778; font-size: 10px; font-weight: 600; }
  .facts { padding: 7px 18px 8px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 3px 14px; background: #fbfdfe; }
  .facts .row { display: inline-flex; gap: 4px; font-size: 11px; min-width: 0; }
  .facts .row b { width: auto; color: #8b9aa7; font-size: 10px; font-weight: 600; }
  .facts .id-row { flex-basis: 100%; }
  .facts .id-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .transcript { padding: 12px 16px 22px; overflow: auto; flex: 1; background: #f7fafb; }
  .bubble-wrap { display: flex; margin: 9px 0; }
  .bubble-wrap.out { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 9px 12px; border-radius: 12px; background: #fff; border: 1px solid #e3ebef; line-height: 1.55; white-space: pre-wrap; word-break: break-word; box-shadow: 0 2px 5px rgba(25,46,62,.04); }
  .out .bubble { background: #14838f; color: #fff; border-color: #14838f; }
  .bubble .meta { margin-bottom: 4px; font-size: 10px; opacity: .58; }
  .transcript-empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  .handoff-note { margin: 18px 4px 8px; padding: 12px 13px; border: 1px solid #f0c9d0; border-left: 4px solid #d95c6e; border-radius: 10px; background: #fff7f8; color: #7f2d3c; }
  .handoff-note h3 { margin: 0 0 8px; color: #a83b4d; font-size: 13px; }
  .handoff-note .row { display: flex; gap: 8px; margin: 5px 0; font-size: 12px; line-height: 1.55; }
  .handoff-note .row b { flex: none; width: 36px; color: #b25a69; }
  .handoff-note .row span { white-space: pre-wrap; word-break: break-word; }
  body.history-mode { width: 100vw; overflow: hidden; }
  body.history-mode .shell { display: none; }
  body.history-mode .drawer-mask { display: none !important; }
  body.history-mode .drawer { top: 0; bottom: 0; left: 0; right: auto; height: 100vh; border: 0; border-radius: 0; width: 100vw !important; max-width: 100vw !important; transform: none !important; box-shadow: none; }
  body.history-mode .drawer-head { padding-top: 18px; }
  @media (max-width: 1180px) { .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    .shell { padding: 20px 14px 40px; }
    header { align-items: flex-start; flex-direction: column; gap: 14px; }
    .header-actions { justify-content: flex-start; }
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filter-meta { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <div class="eyebrow">BOSS AUTO REPLY</div>
      <h1>沟通报告</h1>
      <p class="sub" id="subtitle">本地聊天记录 · 时间取本地首次记录 · 自动汇总微信、手机号与简历交换 · 每 5 秒实时刷新</p>
    </div>
    <div class="header-actions">
      <span class="live" id="live"><i></i><span id="liveText">实时</span></span>
      <span class="updated" id="updated">正在读取…</span>
      <button class="btn" id="refresh">刷新</button>
    </div>
  </header>

  <section class="metrics" id="metrics"></section>

  <section class="filter-card">
    <div class="search"><input id="q" type="search" placeholder="搜索候选人、岗位、微信或手机号"></div>
    <select id="initiation">
      <option value="">全部发起方</option>
      <option value="被动招呼">被动招呼</option>
      <option value="主动招呼">主动招呼</option>
    </select>
    <select id="account"><option value="">全部账号</option></select>
    <select id="wechatFilter">
      <option value="">微信：全部</option>
      <option value="yes">微信：已交换</option>
      <option value="no">微信：否</option>
    </select>
    <select id="phoneFilter">
      <option value="">电话：全部</option>
      <option value="yes">电话：已交换</option>
      <option value="no">电话：否</option>
    </select>
    <select id="resumeFilter">
      <option value="">简历：全部</option>
      <option value="yes">简历：已交换</option>
      <option value="no">简历：否</option>
    </select>
    <select id="handoffFilter">
      <option value="">回复状态：全部</option>
      <option value="needs_human">未完全回复</option>
      <option value="complete">已回复</option>
    </select>
    <button class="btn" id="reset">清空筛选</button>
    <span class="filter-meta" id="filterMeta">—</span>
  </section>

  <section class="table-card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th class="sortable" data-sort="time">时间 <span class="arrow" id="timeArrow">↓</span></th>
            <th>候选人</th>
            <th>企业</th>
            <th>岗位</th>
            <th>消息发起方</th>
            <th>交换信息</th>
            <th>消息</th>
            <th>我方回复</th>
            <th>聊天记录</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty"><b>还没有本地聊天记录</b>开始挂机回复或点击悬浮窗“回复当前窗口”后，记录会自动出现在这里。</div>
  </section>
</div>

<div class="drawer-mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <button class="drawer-close" id="closeDrawer" aria-label="关闭">×</button>
    <div class="eyebrow">CONVERSATION</div>
    <h2 id="drawerName">—</h2>
    <p id="drawerJob">—</p>
    <div class="drawer-tools">
      <input id="historySearch" type="search" placeholder="搜索会话">
      <select id="historySelect" aria-label="选择聊天会话"></select>
    </div>
    <div class="drawer-facts" id="drawerFacts"></div>
  </div>
  <div class="facts" id="drawerContacts"></div>
  <div class="transcript" id="transcript"></div>
</aside>

<script id="embeddedData" type="application/json"></script>
<script>
const embeddedElement = document.getElementById('embeddedData');
const embeddedData = embeddedElement && embeddedElement.textContent.trim()
  ? JSON.parse(embeddedElement.textContent) : null;
const state = {
  data: null,
  sort: 'desc',
  selected: null,
  timer: null,
  staticMode: Boolean(embeddedData),
  historyMode: new URLSearchParams(location.search).get('mode') === 'history',
  initialConversation: new URLSearchParams(location.search).get('conversation') || '',
  historyRecords: [],
  historyListSignature: '',
  drawerSignature: '',
};

if (state.staticMode) {
  document.getElementById('subtitle').textContent =
    '本地 HTML 快照 · 生成时数据固定 · 可离线打开 · 点击「查看聊天记录」在页面内展开';
}

if (state.historyMode) {
  document.body.classList.add('history-mode');
  document.title = 'BOSS 聊天记录';
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  const drawer = document.getElementById('drawer');
  drawer.style.setProperty('width', '100vw', 'important');
  drawer.style.setProperty('max-width', '100vw', 'important');
  drawer.style.setProperty('left', '0', 'important');
  drawer.style.setProperty('right', 'auto', 'important');
  drawer.style.setProperty('transform', 'none', 'important');
}

const el = (id) => document.getElementById(id);

function fmtTime(value) {
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function contactOf(record, key) {
  return ((record.contacts || {})[key] || {}).value || '';
}

function contactStatus(record, key) {
  return contactOf(record, key) ? 'yes' : 'no';
}

function renderMetrics(metrics) {
  const cards = [
    ['沟通会话', metrics.conversations, '已记录的 BOSS 对话'],
    ['已回复会话', metrics.replied, '至少有 1 条我方消息'],
    ['消息总数', metrics.messages, '候选人 + 我方'],
    ['获得微信', metrics.wechat, '已识别微信号'],
    ['获得手机号', metrics.phone, '已识别 11 位手机号'],
    ['交换简历', metrics.resume, '已识别简历交换'],
    ['未完全回复', metrics.needs_human, '需要人工补充知识库'],
  ];
  el('metrics').replaceChildren(...cards.map(([label, value, hint]) => {
    const box = document.createElement('div');
    box.className = 'metric';
    const l = document.createElement('div');
    l.className = 'label';
    l.textContent = label;
    const v = document.createElement('div');
    v.className = 'value';
    v.textContent = value ?? 0;
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = hint;
    box.append(l, v, h);
    return box;
  }));
}

function renderAccountOptions(records) {
  const select = el('account');
  const current = select.value;
  const accounts = [...new Set(records.map((r) => r.account).filter(Boolean))].sort();
  select.replaceChildren(new Option('全部账号', ''), ...accounts.map((a) => new Option(a, a)));
  select.value = accounts.includes(current) ? current : '';
}

function filteredRecords() {
  const records = (state.data && state.data.records) || [];
  const q = el('q').value.trim().toLowerCase();
  const initiation = el('initiation').value;
  const account = el('account').value;
  const wx = el('wechatFilter').value;
  const phone = el('phoneFilter').value;
  const resume = el('resumeFilter').value;
  const handoff = el('handoffFilter').value;
  return records.filter((record) => {
    const haystack = [
      record.candidate_name, record.job_title, record.job_id, record.account,
      contactOf(record, 'wechat'), contactOf(record, 'phone'),
    ].join(' ').toLowerCase();
    if (q && !haystack.includes(q)) return false;
    if (initiation && record.initiation !== initiation) return false;
    if (account && record.account !== account) return false;
    if (wx && contactStatus(record, 'wechat') !== wx) return false;
    if (phone && contactStatus(record, 'phone') !== phone) return false;
    if (resume && contactStatus(record, 'resume') !== resume) return false;
    if (handoff) {
      const status = record.reply_status || (record.handoff ? 'needs_human' : 'complete');
      if (status !== handoff) return false;
    }
    return true;
  }).sort((a, b) => {
    const left = a.first_message_time || '';
    const right = b.first_message_time || '';
    return state.sort === 'desc' ? right.localeCompare(left) : left.localeCompare(right);
  });
}

function contactRow(label, value, className = '') {
  const row = document.createElement('div');
  row.className = 'contact';
  const name = document.createElement('b');
  name.textContent = label;
  const content = document.createElement('span');
  content.className = value ? `yes ${className}` : 'no';
  content.textContent = value || '否';
  row.append(name, content);
  return row;
}

function renderRows() {
  const records = filteredRecords();
  const total = (state.data && state.data.records || []).length;
  el('filterMeta').textContent = `已筛选 ${records.length} / 共 ${total} 个会话`;
  el('empty').style.display = records.length ? 'none' : 'block';
  el('empty').querySelector('b').textContent = total ? '没有符合筛选条件的记录' : '还没有本地聊天记录';
  const rows = el('rows');
  rows.replaceChildren(...records.map((record) => {
    const tr = document.createElement('tr');
    if (record.handoff) tr.classList.add('needs-human');
    tr.addEventListener('click', () => openDrawer(record));

    const time = document.createElement('td');
    time.className = 'time';
    time.textContent = fmtTime(record.first_message_time);
    const count = document.createElement('small');
    count.textContent = `${record.message_count || 0} 条消息`;
    time.append(count);

    const person = document.createElement('td');
    person.className = 'person';
    if (record.handoff) person.classList.add('needs-human-name');
    person.textContent = record.candidate_name || '未命名';
    if (record.handoff) {
      const badge = document.createElement('span');
      badge.className = 'handoff-badge';
      badge.textContent = '未完全回复';
      person.append(badge);
    }

    const enterprise = document.createElement('td');
    enterprise.className = 'enterprise-cell';
    enterprise.textContent = (record.job_id || '').trim() || '未标注企业';

    const job = document.createElement('td');
    job.className = 'job';
    job.textContent = (record.job_title || '').trim() || '未标注岗位';

    const initiation = document.createElement('td');
    const tag = document.createElement('span');
    tag.className = `tag ${record.initiation === '被动招呼' ? 'passive' : record.initiation === '主动招呼' ? 'active' : 'unknown'}`;
    tag.textContent = record.initiation || '未判断';
    initiation.append(tag);

    const exchange = document.createElement('td');
    const contacts = document.createElement('div');
    contacts.className = 'contacts';
    const lines = [];
    const wechat = contactOf(record, 'wechat');
    const phone = contactOf(record, 'phone');
    const resume = contactOf(record, 'resume');
    if (wechat) lines.push(`微信：${wechat}`);
    if (phone) lines.push(`电话：${phone}`);
    if (resume) lines.push('已交换简历');
    if (!lines.length) lines.push('否');
    contacts.append(...lines.map((text) => Object.assign(
      document.createElement('div'), { className: 'contact', textContent: text })));
    exchange.append(contacts);

    const messageCount = document.createElement('td');
    messageCount.className = 'count';
    messageCount.textContent = record.message_count || 0;
    messageCount.append(Object.assign(document.createElement('span'), { textContent: ' 条' }));

    const replyCount = document.createElement('td');
    replyCount.className = 'count';
    replyCount.textContent = record.reply_count || 0;
    replyCount.append(Object.assign(document.createElement('span'), { textContent: ' 条' }));

    const chat = document.createElement('td');
    const chatButton = document.createElement('button');
    chatButton.className = 'row-chat-btn';
    chatButton.textContent = '查看聊天记录';
    chatButton.addEventListener('click', (event) => {
      event.stopPropagation();
      openDrawer(record);
    });
    chat.append(chatButton);

    tr.append(time, person, enterprise, job, initiation, exchange, messageCount, replyCount, chat);
    return tr;
  }));
}

function fact(text) {
  const span = document.createElement('span');
  span.className = 'fact';
  span.textContent = text;
  return span;
}

function drawerContact(label, value, rowClass = '') {
  const row = document.createElement('div');
  row.className = `row ${rowClass}`.trim();
  const key = document.createElement('b');
  key.textContent = label;
  const content = document.createElement('span');
  content.textContent = value || '否';
  if (rowClass) content.title = value || '';
  row.append(key, content);
  return row;
}

function historyFiltered() {
  const records = (state.data && state.data.records) || [];
  const q = el('historySearch').value.trim().toLowerCase();
  if (!q) return records;
  return records.filter((record) => {
    const haystack = [
      record.candidate_name, record.job_title, record.job_id,
      contactOf(record, 'wechat'), contactOf(record, 'phone'),
      ...(record.messages || []).map((message) => message.text),
    ].join(' ').toLowerCase();
    return haystack.includes(q);
  });
}

function renderHistoryOptions() {
  const records = historyFiltered();
  state.historyRecords = records;
  state.historyListSignature = ((state.data && state.data.records) || []).map(
    (record) => [record.conversation_id, record.message_count, record.last_message_time].join('|'),
  ).join(';;');
  const select = el('historySelect');
  select.replaceChildren(...records.map((record, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = `${record.candidate_name || '未命名'} · ${record.job_title || record.job_id || '未标注岗位'}`;
    return option;
  }));
  const index = records.findIndex((record) => record.conversation_id === state.selected);
  select.value = String(index >= 0 ? index : 0);
}

function openHistoryPanel(record) {
  renderHistoryOptions();
  const records = state.historyRecords;
  if (!records.length) return;
  const target = record || records.find((item) => item.conversation_id === state.selected) || records[0];
  openDrawer(target);
}

function openDrawer(record) {
  state.selected = record.conversation_id;
  state.drawerSignature = `${record.message_count || 0}|${record.last_message_time || ''}`;
  el('drawerName').textContent = record.candidate_name || '未命名候选人';
  el('drawerJob').textContent = `${record.job_title || record.job_id || '未标注岗位'} · ${record.account || '未命名账号'}`;
  el('drawerFacts').replaceChildren(
    fact(record.initiation || '未判断'),
    fact(`首次 ${fmtTime(record.first_message_time)}`),
    fact(`${record.message_count || 0} 条消息`),
    fact(`我方 ${record.reply_count || 0} 条`),
  );
  el('drawerContacts').replaceChildren(
    drawerContact('微信', contactOf(record, 'wechat')),
    drawerContact('手机号', contactOf(record, 'phone')),
    drawerContact('简历', contactOf(record, 'resume')),
    drawerContact('会话 ID', record.conversation_id || '', 'id-row'),
  );
  const transcript = el('transcript');
  const messages = record.messages || [];
  if (!messages.length) {
    const empty = document.createElement('div');
    empty.className = 'transcript-empty';
    empty.textContent = '暂无聊天正文';
    transcript.replaceChildren(empty);
  } else {
    transcript.replaceChildren(...messages.map((message) => {
      const wrap = document.createElement('div');
      wrap.className = `bubble-wrap ${message.role === 'recruiter' ? 'out' : ''}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${message.role === 'recruiter' ? '我方' : '候选人'} · ${fmtTime(message.first_seen)}`;
      const text = document.createElement('div');
      text.textContent = message.text || '';
      bubble.append(meta, text);
      wrap.append(bubble);
      return wrap;
    }));
  }
  if (record.handoff) {
    const note = document.createElement('div');
    note.className = 'handoff-note';
    const title = document.createElement('h3');
    title.textContent = '未完全回复 · 需要人工';
    note.append(title);
    for (const [label, value] of [
      ['问题', record.handoff.question || '未记录'],
      ['原因', record.handoff.reason || '未记录'],
      ['时间', fmtTime(record.handoff.at)],
    ]) {
      const row = document.createElement('div');
      row.className = 'row';
      const key = document.createElement('b');
      key.textContent = label;
      const content = document.createElement('span');
      content.textContent = value;
      row.append(key, content);
      note.append(row);
    }
    transcript.append(note);
  }
  document.body.classList.add('drawer-open');
  el('drawer').setAttribute('aria-hidden', 'false');
  transcript.scrollTop = transcript.scrollHeight;
  if (!state.historyRecords.length) renderHistoryOptions();
  const historyIndex = state.historyRecords.findIndex(
    (item) => item.conversation_id === record.conversation_id,
  );
  if (historyIndex >= 0) el('historySelect').value = String(historyIndex);
}

function closeDrawer() {
  if (state.historyMode) {
    window.close();
    return;
  }
  document.body.classList.remove('drawer-open');
  el('drawer').setAttribute('aria-hidden', 'true');
  state.selected = null;
}

function setLive(ok, text) {
  el('live').classList.toggle('stale', !ok);
  el('liveText').textContent = text;
}

function applyData(data) {
  state.data = data;
  if (state.historyMode) {
    const listSignature = (data.records || []).map(
      (record) => [record.conversation_id, record.message_count, record.last_message_time].join('|'),
    ).join(';;');
    if (listSignature !== state.historyListSignature) {
      renderHistoryOptions();
    }
    if (!state.selected) {
      const initial = (data.records || []).find(
        (record) => record.conversation_id === state.initialConversation,
      );
      openHistoryPanel(initial);
    } else {
      const selected = (data.records || []).find((r) => r.conversation_id === state.selected);
      const signature = selected ? `${selected.message_count || 0}|${selected.last_message_time || ''}` : '';
      if (selected && signature !== state.drawerSignature) openDrawer(selected);
      else if (!selected) openHistoryPanel();
    }
  } else {
    renderMetrics(data.metrics || {});
    renderAccountOptions(data.records || []);
    renderRows();
  }
  el('updated').textContent = `更新 ${fmtTime(data.generated_at).slice(11)}`;
  if (!state.historyMode && state.selected) {
    const selected = (data.records || []).find((r) => r.conversation_id === state.selected);
    const signature = selected ? `${selected.message_count || 0}|${selected.last_message_time || ''}` : '';
    if (selected && signature !== state.drawerSignature) openDrawer(selected);
  }
}

async function load() {
  if (state.staticMode) {
    if (!state.data) {
      applyData(embeddedData);
      setLive(true, '本地快照');
    }
    return;
  }
  try {
    const response = await fetch(`/api/data?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    setLive(true, '实时');
    applyData(data);
  } catch (error) {
    setLive(false, '连接中断');
    el('updated').textContent = '读取失败';
  }
}

function schedule() {
  clearInterval(state.timer);
  if (!state.staticMode) state.timer = setInterval(load, 5000);
}

el('refresh').addEventListener('click', () => {
  if (state.staticMode) {
    location.reload();
    return;
  }
  load();
  schedule();
});
el('historySearch').addEventListener('input', () => {
  renderHistoryOptions();
  if (state.historyRecords.length) {
    openDrawer(state.historyRecords[0]);
  }
});
el('historySelect').addEventListener('change', () => {
  const record = state.historyRecords[Number(el('historySelect').value)];
  if (record) openDrawer(record);
});
el('reset').addEventListener('click', () => {
  ['q', 'initiation', 'account', 'wechatFilter', 'phoneFilter', 'resumeFilter', 'handoffFilter'].forEach((id) => { el(id).value = ''; });
  renderRows();
});
['q', 'initiation', 'account', 'wechatFilter', 'phoneFilter', 'resumeFilter', 'handoffFilter'].forEach((id) => {
  el(id).addEventListener('input', renderRows);
  el(id).addEventListener('change', renderRows);
});
document.querySelector('th[data-sort="time"]').addEventListener('click', () => {
  state.sort = state.sort === 'desc' ? 'asc' : 'desc';
  el('timeArrow').textContent = state.sort === 'desc' ? '↓' : '↑';
  renderRows();
});
el('closeDrawer').addEventListener('click', closeDrawer);
el('mask').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeDrawer(); });

load();
schedule();
</script>
</body>
</html>
